    <rt:sub>Sub Color(ByVal dm_color as Uint, ByRef dist_mag_color as String)
If dm_color == 0 Then
	dist_mag_color = &quot;Col_Grey1&quot;
Else
	If dm_color == 1 or dm_color == 11 Then
		dist_mag_color = &quot;Col_Usr1&quot;
	Else
		If dm_color == 2 or dm_color == 12 Then
			dist_mag_color = &quot;Col_Yellow&quot;
		Else
			If dm_color == 3 or dm_color == 13 Then
				dist_mag_color = &quot;Col_Orange&quot;
			Else
				If dm_color == 4 or dm_color == 14 Then
					dist_mag_color = &quot;Col_Red&quot;
				Else
					dist_mag_color = &quot;none&quot;
				End if
			End If
		End If
	End If
	
End If
End Sub</rt:sub>

<rt:sub>Sub HalfWhite()
		If dm_color_1 &gt; 10 Then
			dist_ns_1 = True	
		else
			dist_ns_1 = False
		End If	
		If dm_color_2 &gt; 10 Then
			dist_ns_2 = True	
		else
			dist_ns_2 = False
		End If	
		If dm_color_3 &gt; 10 Then
			dist_ns_3 = True	
		else
			dist_ns_3 = False
		End If			
		If dm_color_4 &gt; 10 Then
			dist_ns_4 = True	
		else
			dist_ns_4 = False
		End If	
		If dm_color_5 &gt; 10 Then
			dist_ns_5 = True	
		else
			dist_ns_5 = False
		End If	
		If dm_color_6 &gt; 10 Then
			dist_ns_6 = True	
		else
			dist_ns_6 = False
		End If		
		If dm_color_7 &gt; 10 Then
			dist_ns_7 = True	
		else
			dist_ns_7 = False
		End If	
End Sub</rt:sub>

    <rt:changeTrigger name="Color">
      <rt:chgItem>dm_color_1</rt:chgItem>
      <rt:chgItem>dm_color_2</rt:chgItem>
      <rt:chgItem>dm_color_3</rt:chgItem>
      <rt:chgItem>dm_color_4</rt:chgItem>
