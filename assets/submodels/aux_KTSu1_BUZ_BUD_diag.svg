    <rt:sub>Sub B0_diag()
	HighlightMessage(B0_gr_bit0, PRJSPEC.DetectBit(B0, 16), 0)
	HighlightMessage(B0_gr_bit1, PRJSPEC.DetectBit(B0, 15), 0)
	HighlightMessage(B0_gr_bit2, PRJSPEC.DetectBit(B0, 14), 0)
	HighlightMessage(B0_gr_bit3, PRJSPEC.DetectBit(B0, 13), 0)
	HighlightMessage(B0_gr_bit4, PRJSPEC.DetectBit(B0, 12), Middle_Color_Wieghted(Color_Imitation, 0,0.75))
End Sub</rt:sub>
    <rt:sub>Sub Z0_diag()
	HighlightMessage(Z0_gr_bit1, PRJSPEC.DetectBit(Z0, 15), 0)
	HighlightMessage(Z0_gr_bit0, PRJSPEC.DetectBit(Z0, 16), 0)
End Sub</rt:sub>
    <rt:sub>Sub F1_diag()
	HighlightMessage(F1_gr_bit0, PRJSPEC.DetectBit(F1, 16), 0xf5)
	HighlightMessage(F1_gr_bit1, PRJSPEC.DetectBit(F1, 15), 0xf5)
	HighlightMessage(F1_gr_bit2, PRJSPEC.DetectBit(F1, 14), 0xf5)
	HighlightMessage(F1_gr_bit3, PRJSPEC.DetectBit(F1, 13), 0xf5)
	HighlightMessage(F1_gr_bit4, PRJSPEC.DetectBit(F1, 12), 0xf5)
	HighlightMessage(F1_gr_bit5, PRJSPEC.DetectBit(F1, 11), Middle_Color_Wieghted(Color_Imitation, 0,0.75))
	HighlightMessage(F1_gr_bit7, PRJSPEC.DetectBit(F1, 9), 0xf5)
End Sub</rt:sub>
    <rt:sub>Sub F2_diag()
