    <rt:sub>Sub VB9_diag()
If Is_BUD Then
	HighlightMessage(VB9_gr_bit0, PRJSPEC.DetectBit(VB9, 16), 0xf5)
	HighlightMessage(VB9_gr_bit1, PRJSPEC.DetectBit(VB9, 15), 0)
	HighlightMessage(VB9_gr_bit2, PRJSPEC.DetectBit(VB9, 14), 0)
End If
	HighlightMessage(VB9_gr_bit3, PRJSPEC.DetectBit(VB9, 13), 0)
	HighlightMessage(VB9_gr_bit4, PRJSPEC.DetectBit(VB9, 12), 0)
	HighlightMessage(VB9_gr_bit5, PRJSPEC.DetectBit(VB9, 11), 0)
	HighlightMessage(VB9_gr_bit6, PRJSPEC.DetectBit(VB9, 10), 0)
	HighlightMessage(VB9_gr_bit8, PRJSPEC.DetectBit(VB9, 8), 0)
	HighlightMessage(VB9_gr_bit9, PRJSPEC.DetectBit(VB9, 7), 0)
End Sub</rt:sub>
    <rt:sub>Sub VB10_diag()
