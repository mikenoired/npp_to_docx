	HighlightMessage(VB10_gr_bit2, PRJSPEC.DetectBit(VB10, 14), 0)
	HighlightMessage(VB10_gr_bit3, PRJSPEC.DetectBit(VB10, 13), 0)
If Is_BUD Then
	HighlightMessage(VB10_gr_bit3a, PRJSPEC.DetectBit(VB10, 13), 0)
End If
End Sub</rt:sub>
    <rt:sub>Sub VB12_diag()
