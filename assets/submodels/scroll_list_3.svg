<?xml  version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:rt="http://www.rts.co.at/2001/XMLSchema/RtSvgPL" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://www.w3.org/2000/svg C:\RTS\RtSvg\XML\SVG.xsd" preserveAspectRatio="unknown meet" viewBox="0 0 300 75" width="300" height="75" id="scroll_list_3">
  <desc>Список из 3 элементов</desc>
  <rt:model comment="Служебная подмодель ПОРТАЛа" revision="6.0">
    <rt:param name="StrLen" datatype="int" value="25" comment="Длина строк"/> 
    <rt:param name="Background_Color" datatype="string" value="white" comment="Цвет подложки строк без выделения"/> 
    <rt:var name="Sel_s" datatype="string" comment="Выбранная строка"/> 
    <rt:var name="Total_i" datatype="int" value="0" comment="Всего элементов в списке"/> 
    <rt:var name="Shift_i" datatype="int" value="0" comment="Смещение видимых строк относительно начала списка"/> 
    <rt:var name="L_move" datatype="float" comment="? непонятно что"/> 
    <rt:var name="H_move" datatype="float" comment="? непонятно что"/> 
    <rt:var name="Cur_i" datatype="int" value="-1" comment="Текущий выбранный элемент (1-й = 0)"/> 
    <rt:var name="Item_s" datatype="string" arraysize="100" comment="Массив строк"/> 
    <rt:var name="VisItem_s" datatype="string" arraysize="3" comment="Массив видимых строк"/> 
    <rt:var name="ActiveItem_i" datatype="boolean" arraysize="3" comment="Массив активности строк"/> 
    <rt:sub>Sub Get_Vis()
Dim i As Integer
For i = 0 to 2
	VisItem_s(i) = Item_s(i + Shift_i)
Next i
End Sub</rt:sub>
    <rt:sub>Sub Reselect()
Dim i As int
For i = 0 to 2
	If (i == (Cur_i - Shift_i)) Then
		ActiveItem_i(i) = True
	Else
		ActiveItem_i(i) = False
	End If
Next i
Slider.N_first = Shift_i + 1
Slider.N = Cur_i + 1
End Sub</rt:sub>
    <rt:sub>Sub Clear_Items()
Dim i As Integer
For i = 0 To Total_i
	Item_s(i) = &quot;&quot;
Next i
For i = 0 To 2
	VisItem_s(i) = &quot;&quot;
	ActiveItem_i(i) = false
Next i
Total_i = 0
Cur_i = -1
Shift_i = 0
Sel_s = &quot;&quot;
Get_Vis()
Reselect()
Slider.Slider_pos()
End Sub</rt:sub>
    <rt:sub>Sub Add_Item(ByVal In_Str As String)
If (Total_i &lt; 100) Then
	Item_s(Total_i) = In_Str
	Total_i = Total_i + 1
	Get_Vis()
	Slider.Slider_pos()
End If
End Sub</rt:sub>
    <rt:sub>Sub SelectVis_n (ByVal i As Integer)
&apos;выбор из числа видимых
If ((i &lt; 0) || (i &gt; 2)) Then
	Cur_i = -1
	Sel_s = &quot;&quot;
	Get_Vis()
ElseIf (VisItem_s(i) == &quot;&quot;) || (i &gt; (Total_i - 1)) Then
	Cur_i = -1
	Sel_s = &quot;&quot;
	Get_Vis()
Else
	Get_Vis()
	Sel_s = VisItem_s(i)
	Cur_i = i + Shift_i
End If
Reselect()
End Sub</rt:sub>
    <rt:timeTrigger name="Redraw" delay="100">
      <rt:code>Get_Vis()</rt:code>
    </rt:timeTrigger>
    <rt:event type="OnInitialize">Dim i As int
For i = 0 to 2
	VisItem_s(i) = &quot;&quot;
Next i
Slider.Slider_pos()</rt:event>
    <rt:event type="OnResize">Slider.x = _This.width - _This.height / 3.75
Slider.width = _This.height / 3.75 - 2</rt:event>
    <rt:changeTrigger name="ChScrollBar">
      <rt:chgItem>Slider.N_first</rt:chgItem>
      <rt:code>Shift_i = Slider.N_first - 1</rt:code>
      <rt:code>Cur_i = Slider.N - 1</rt:code>
      <rt:code>SelectVis_n(Cur_i - Shift_i)</rt:code>
    </rt:changeTrigger>
  </rt:model>
  <rect x="0" y="0" width="300" height="75" rx="0" ry="0" id="Backgr" fill="white" stroke="none">
    <rt:dyn type="fill" mode="constant" value="Background_Color"/> 
  </rect>
  <image width="300" height="24" xlink:href="scroll_line.svg" id="Item0">
    <rt:dyn type="NumChars" mode="constant" value="StrLen"/> 
    <rt:dyn type="IsActive" mode="onchange" value="ActiveItem_i(0)"/> 
    <rt:dyn type="Txt_line" mode="onchange" value="VisItem_s(0)"/> 
    <rt:event type="OnClick">SelectVis_n(0)</rt:event>
    <rt:dyn type="Background_Color" mode="constant" value="Background_Color"/> 
  </image>
  <image y="25" width="300" height="24" xlink:href="scroll_line.svg" id="Item1">
    <rt:dyn type="NumChars" mode="constant" value="StrLen"/> 
    <rt:dyn type="IsActive" mode="onchange" value="ActiveItem_i(1)"/> 
    <rt:dyn type="Txt_line" mode="onchange" value="VisItem_s(1)"/> 
    <rt:event type="OnClick">SelectVis_n(1)</rt:event>
    <rt:dyn type="Background_Color" mode="constant" value="Background_Color"/> 
  </image>
  <image y="50" width="300" height="24" xlink:href="scroll_line.svg" id="Item2">
    <rt:dyn type="NumChars" mode="constant" value="StrLen"/> 
    <rt:dyn type="IsActive" mode="onchange" value="ActiveItem_i(2)"/> 
    <rt:dyn type="Txt_line" mode="onchange" value="VisItem_s(2)"/> 
    <rt:event type="OnClick">SelectVis_n(2)</rt:event>
    <rt:dyn type="Background_Color" mode="constant" value="Background_Color"/> 
  </image>
  <image x="280" y="2" width="18" height="71" xlink:href="scroll_bar_v.svg" id="Slider">
    <rt:dyn type="NN" mode="onchange" value="Total_i"/> 
    <rt:dyn type="MM" mode="constant" value="3"/> 
    <rt:dyn type="N_first" mode="constant" value="(Shift_i + 1)"/> 
    <rt:dyn type="N" mode="constant" value="(Cur_i + 1)"/> 
    <rt:dyn type="visibility" mode="onchange" value="(Total_i &lt; 4)" trans="bi">
      <rt:xy value="false" value2="0"/> 
      <rt:xy value2="1"/> 
    </rt:dyn>
    <rt:dyn type="Tint" mode="constant" value="Background_Color"/> 
  </image>
  <polyline points="0,75 0,0 300,0" fill="none" stroke="Col_Grey5" stroke-width="2"/> 
  <polyline points="0,75 300,75 300,0" fill="none" stroke="Col_Grey1" stroke-width="2"/> 
</svg>
