<?xml  version="1.0" encoding="UTF-8"?>
<svg color="Col_BGwin" xmlns="http://www.w3.org/2000/svg" xmlns:rt="http://www.rts.co.at/2001/XMLSchema/RtSvgPL" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://www.w3.org/2000/svg C:\RTS\RtSvg\XML\SVG.xsd" viewBox="0 0 485 330" width="485" height="330" id="aux_TPTS_SR_diag" font-family="AAP_Font4" font-size="13" font-weight="bold">
  <desc>подмодель диагностики для ТПТС SR</desc>
  <rt:model comment="Служебная подмодель ПОРТАЛа" revision="6.0">
    <rt:param name="KKS" datatype="string" comment="KKS объекта"/> 
    <rt:param name="F0" datatype="PlsPVBin" comment="указатель на BST F0"/> 
    <rt:param name="F1" datatype="PlsPVBin" comment="указатель на BST F1"/> 
    <rt:param name="F2" datatype="PlsPVBin" comment="указатель на BST F2"/> 
    <rt:param name="Z0" datatype="PlsPVBin" comment="указатель на BST Z0"/> 
    <rt:param name="B0" datatype="PlsPVBin" comment="указатель на BST B0"/> 
    <rt:param name="VB6" datatype="PlsPVBin" comment="указатель на PL VB6"/> 
    <rt:param name="VB9" datatype="PlsPVBin" comment="указатель на PL VB9"/> 
    <rt:param name="VB10" datatype="PlsPVBin" comment="указатель на PL VB10"/> 
    <rt:param name="VB11" datatype="PlsPVBin" comment="указатель на PL VB11"/> 
    <rt:param name="OU" datatype="PlsPVBin" comment="команда управления"/> 
    <rt:param name="SP" datatype="PlsPVAna" comment="ввод задания"/> 
    <rt:param name="NoSP" datatype="boolean" value="false" comment="ввод задания запрещен"/> 
    <rt:param name="pv_Open" datatype="PlsPVBin" comment="указатель на pv_Open"/> 
    <rt:param name="pv_Close" datatype="PlsPVBin" comment="указатель на pv_Close"/> 
    <rt:var name="No_OU" datatype="boolean" comment="нет переменной управления"/> 
    <rt:var name="STrig" datatype="boolean" value="false" comment="в ремонте"/> 
    <rt:var name="Is_KR" datatype="boolean" value="false" comment="Это не SR, а KR"/> 
    <rt:sub>Sub HighlightMessage(ByVal TxtObj As RtSvgObj, ByVal Highlight As Boolean, ByVal HighlightColor As Int)
If Highlight Then
	TxtObj.fill = HighlightColor
	TxtObj.font_size = 13
	TxtObj.font_weight = &quot;bold&quot;
Else
	TxtObj.fill = 0xa0a0a0
	TxtObj.font_size = 11
	TxtObj.font_weight = &quot;normal&quot;
End If
End Sub</rt:sub>
    <rt:sub>Sub F1_diag()
	HighlightMessage(F1_gr_XDGM, PRJSPEC.DetectBit(F1, 5), 0xf5)
	HighlightMessage(F1_gr_GSI, PRJSPEC.DetectBit(F1, 7), 0xf5)
	HighlightMessage(F1_gr_VO, PRJSPEC.DetectBit(F1, 8), 0xf5)
	HighlightMessage(F1_gr_UA, PRJSPEC.DetectBit(F1, 9), 0xf5)
	HighlightMessage(F1_gr_AZS, PRJSPEC.DetectBit(F1, 10), 0xf5)
	HighlightMessage(F1_gr_MTZH, PRJSPEC.DetectBit(F1, 11), 0xf5)
	HighlightMessage(F1_gr_MUS, PRJSPEC.DetectBit(F1, 12), 0xf5)
	HighlightMessage(F1_gr_RMF2, PRJSPEC.DetectBit(F1, 13), 0xf5)
	HighlightMessage(F1_gr_RMF1, PRJSPEC.DetectBit(F1, 14), 0xf5)
	HighlightMessage(F1_gr_DEAFS, PRJSPEC.DetectBit(F1, 15), 0xf5)
	HighlightMessage(F1_gr_DEZUS, PRJSPEC.DetectBit(F1, 16), 0xf5)
End Sub</rt:sub>
    <rt:sub>Sub F2_diag()
	HighlightMessage(F2_gr_UEBA, PRJSPEC.DetectBit(F2, 15), 0xf5)
	HighlightMessage(F2_gr_TE, PRJSPEC.DetectBit(F2, 16), Middle_Color_Wieghted(Color_Imitation, 0,0.75))
End Sub</rt:sub>
    <rt:sub>Sub VB6_diag()
	HighlightMessage(VB6_gr_BAN, PRJSPEC.CheckBits(VB6, 0xe10, True), 0xf5)
	HighlightMessage(VB6_gr_BGF, PRJSPEC.DetectBit(VB6, 8), 0xf5)
	HighlightMessage(VB6_gr_M8_M6, PRJSPEC.CheckBits(VB6, 6, True), Middle_Color_Wieghted(Color_Imitation, 0,0.75))
	If ((VB6.Value &amp; 0x80) != 0) Then
		VB6_gr_BSM.text = &quot;ТЕХНОЛОГИЧЕСКИЙ РЕЖИМ&quot;
	Else
		VB6_gr_BSM.text = &quot;ЭКСПЛУАТАЦИОННЫЙ РЕЖИМ&quot;
	End If
End Sub</rt:sub>
    <rt:sub>Sub VB9_diag()
	HighlightMessage(VB9_gr_ABA, PRJSPEC.DetectBit(VB9, 5), 0)
	HighlightMessage(VB9_gr_ABH, PRJSPEC.DetectBit(VB9, 6), 0)
	HighlightMessage(VB9_gr_BOE, PRJSPEC.DetectBit(VB9, 7), 0)
	HighlightMessage(VB9_gr_BS, PRJSPEC.DetectBit(VB9, 8), 0)
	HighlightMessage(VB9_gr_YFOE, PRJSPEC.DetectBit(VB9, 9), 0)
	HighlightMessage(VB9_gr_YFS, PRJSPEC.DetectBit(VB9, 10), 0)
	HighlightMessage(VB9_gr_RFOE, PRJSPEC.DetectBit(VB9, 11), 0)
	HighlightMessage(VB9_gr_RFS, PRJSPEC.DetectBit(VB9, 12), 0)
	HighlightMessage(VB9_gr_ABOE, PRJSPEC.DetectBit(VB9, 13), 0)
	HighlightMessage(VB9_gr_ABS, PRJSPEC.DetectBit(VB9, 14), 0)
	HighlightMessage(VB9_gr_SOEV, PRJSPEC.DetectBit(VB9, 15), 0)
	HighlightMessage(VB9_gr_SSV, PRJSPEC.DetectBit(VB9, 16), 0)
End Sub</rt:sub>
    <rt:sub>Sub VB10_diag()
	HighlightMessage(VB10_gr_WEAF, PRJSPEC.DetectBit(VB10, 13), 0)
	HighlightMessage(VB10_gr_WEZU, PRJSPEC.DetectBit(VB10, 14), 0)
	HighlightMessage(VB10_gr_ARAF, PRJSPEC.DetectBit(VB10, 15), 0)
	HighlightMessage(VB10_gr_ARZU, PRJSPEC.DetectBit(VB10, 16), 0)
End Sub</rt:sub>
    <rt:sub>Sub VB11_diag()
	HighlightMessage(VB11_gr_BBL, PRJSPEC.DetectBit(VB11, 9) &amp;&amp; PRJSPEC.DetectBit(VB11, 16), 0xf5) //BBL &amp;&amp; LSB
	HighlightMessage(VB11_gr_ZWHF, PRJSPEC.DetectBit(VB11, 10), 0)
End Sub</rt:sub>
    <rt:sub>Sub B0_diag()
	HighlightMessage(B0_gr_HBA, PRJSPEC.DetectBit(B0, 15), 0)
	HighlightMessage(B0_gr_HBH, PRJSPEC.DetectBit(B0, 16), 0)
End Sub</rt:sub>
    <rt:sub>Sub Get_Open_State()
If pv_Open != Nothing Then
	If (pv_Open.Quality == PLS_QUAL_BAD) Then
		MKS_Opened.text_decoration = &quot;password&quot;
	Else
		MKS_Opened.text_decoration = &quot;none&quot;
	End If
	HighlightMessage(MKS_Opened, (pv_Open.Value != 0), 0)
End If
If pv_Close != Nothing Then
	If (pv_Close.Quality == PLS_QUAL_BAD) Then
		MKS_Closed.text_decoration = &quot;password&quot;
	Else
		MKS_Closed.text_decoration = &quot;none&quot;
	End If
	HighlightMessage(MKS_Closed, (pv_Close.Value != 0), 0)
End If
End Sub</rt:sub>
    <rt:event type="OnInitialize">If (pv_Open == Nothing) || (pv_Close == Nothing) Then
	MKS_Opened.visibility = &quot;hidden&quot;
	MKS_Closed.visibility = &quot;hidden&quot;
End If
If (F1 != Nothing) Then	//определяем по F1, т.к. если его нет, то и убираемые для KR надписи будут невидимыми
	If (F1.CategoryNr == 32) Then
		Is_KR = True
	End If
End If

If (OU == nothing) Then
	No_OU = True
ElseIf (OU.PVCategories != 2) Then
	No_OU = True
Else
	No_OU = False
End If

Dim No_SP As Boolean
If NoSP == false Then
	If (SP == Nothing) Then
		No_SP = True
	Else
		If (SP.PVCategories != 2) Then
			No_SP = True
		Else
			No_SP = False
		End If
	End If
Else
	No_SP = False
End If

Dim No_VL_OU As Boolean
If REG_use_VL Then
	Dim VL_OU As PlsPVBin
	VL_OU = BIN(KKS + &quot;VL0_OU&quot;)
	If (VL_OU == nothing) Then
		No_VL_OU = True
	ElseIf (VL_OU.PVCategories != 2) Then
		No_VL_OU = True
	End If
End If
If No_OU Then
&apos;	NO_OU.visibility = &quot;visible&quot;	//надпись и так видимая
	NO_OU.text = &quot;НЕТ ПЕРЕМЕННОЙ УПРАВЛЕНИЯ&quot;
	NO_OU.title = &quot;Переменная &quot; + KKS + &quot;_OU не найдена или ее тип не Out&quot;
ElseIf No_VL_OU Then
&apos;	NO_OU.visibility = &quot;visible&quot;	//надпись и так видимая
	NO_OU.text = &quot;НЕТ ПЕРЕМЕННОЙ УПРАВЛЕНИЯ\nЧЕРЕЗ [I]VL&quot;
	NO_OU.title = &quot;Переменная &quot; + KKS + &quot;VL0_OU не найдена или ее тип не Out&quot;
ElseIf No_SP &amp;&amp; !NoSP Then
&apos;	NO_OU.visibility = &quot;visible&quot;	//надпись и так видимая
	NO_OU.text = &quot;НЕТ ПЕРЕМЕННОЙ ВВОДА\nНОВОГО ЗАДАНИЯ&quot;
	NO_OU.title = &quot;Переменная &quot; + KKS + &quot;_SP не найдена или ее тип не Out&quot;
Else
	NO_OU.visibility = &quot;hidden&quot;
End If</rt:event>
    <rt:changeTrigger name="OnF0">
      <rt:condition>F0 != Nothing</rt:condition>
      <rt:chgItem>F0</rt:chgItem>
      <rt:code>HighlightMessage(F0_OR, PRJSPEC.DetectBit(F0, 11), 0xf5)</rt:code>
    </rt:changeTrigger>
    <rt:changeTrigger name="OnF1">
      <rt:condition>F1 != Nothing</rt:condition>
      <rt:chgItem>F1</rt:chgItem>
      <rt:code>F1_diag()</rt:code>
    </rt:changeTrigger>
    <rt:changeTrigger name="OnF2">
      <rt:condition>F2 != Nothing</rt:condition>
      <rt:chgItem>F2</rt:chgItem>
      <rt:code>F2_diag()</rt:code>
    </rt:changeTrigger>
    <rt:changeTrigger name="OnVB6">
      <rt:condition>VB6 != Nothing</rt:condition>
      <rt:chgItem>VB6</rt:chgItem>
      <rt:code>VB6_diag()</rt:code>
    </rt:changeTrigger>
    <rt:changeTrigger name="OnVB9">
      <rt:condition>VB9 != Nothing</rt:condition>
      <rt:chgItem>VB9</rt:chgItem>
      <rt:code>VB9_diag()</rt:code>
    </rt:changeTrigger>
    <rt:changeTrigger name="OnB0">
      <rt:condition>B0 != Nothing</rt:condition>
      <rt:chgItem>B0</rt:chgItem>
      <rt:code>B0_diag()</rt:code>
    </rt:changeTrigger>
    <rt:changeTrigger name="OnOU">
      <rt:chgItem>OU</rt:chgItem>
      <rt:code>STrig = PRJSPEC.GET_Susp(KKS, True)</rt:code>
      <rt:code>HighlightMessage(OU_SUSP, STrig, 0xf5)</rt:code>
    </rt:changeTrigger>
    <rt:changeTrigger name="OnVB11">
      <rt:condition>VB11 != Nothing</rt:condition>
      <rt:chgItem>VB11</rt:chgItem>
      <rt:code>VB11_diag()</rt:code>
    </rt:changeTrigger>
    <rt:changeTrigger name="OnVB10">
      <rt:condition>VB10 != Nothing</rt:condition>
      <rt:chgItem>VB10</rt:chgItem>
      <rt:code>VB10_diag()</rt:code>
    </rt:changeTrigger>
    <rt:changeTrigger name="MKS_status">
      <rt:chgItem>pv_Open</rt:chgItem>
      <rt:chgItem>pv_Close</rt:chgItem>
      <rt:code>Get_Open_State()</rt:code>
    </rt:changeTrigger>
  </rt:model>
