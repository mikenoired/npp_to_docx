<?xml  version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:rt="http://www.rts.co.at/2001/XMLSchema/RtSvgPL" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://www.w3.org/2000/svg C:\RTS\RtSvg\XML\SVG.xsd" preserveAspectRatio="codedlayout meet" viewBox="0 0 100 50" width="100" height="50" id="ps_Ros3_ana_bar_NP_h" stroke="black" font-size="13">
  <desc>Барограф для отображения нейтронной мощности горизонтальный</desc>
  <rt:model comment="Пользовательская подмодель ПОРТАЛа" revision="6.0" modelversion="0.0.0.0">
    <rt:param name="FKKS1" datatype="string" comment="Идентификатор сигнала заливки"/> 
    <rt:param name="FKKS2" datatype="string" comment="Идентификатор уставки"/> 
    <rt:param name="FKKS3" datatype="string" comment="Идентификатор бинарного сигнала"/> 
    <rt:param name="val_HWB" datatype="double" value="-999" comment="Значение верхней предупредительной уставки"/> 
    <rt:param name="val_LWB" datatype="double" value="-999" comment="Значение нижней предупредительной уставки"/> 
    <rt:param name="ShowDigits" datatype="boolean" value="true" comment="Показывать значения шкалы"/> 
    <rt:param name="IsLogScale" datatype="boolean" value="false" comment="Логарифмический масштаб"/> 
    <rt:var name="pv" datatype="PlsPVAna" value="" comment="DB PV"/> 
    <rt:var name="pv_ana" datatype="PlsPVAna" comment="DB PV"/> 
    <rt:var name="pv_bin" datatype="PlsPVBin" comment="DB PV"/> 
    <rt:var name="In_Group" datatype="boolean" value="false" comment="object in group"/> 
    <rt:var name="FBar" datatype="float" value="1" comment="fill level"/> 
    <rt:var name="FColor" datatype="uint" comment="цвет индикации"/> 
    <rt:var name="M_Color" datatype="uint" comment="Приглушенный цвет"/> 
    <rt:var name="HasError" datatype="boolean" value="false" comment="Ошибка данных"/> 
    <rt:var name="pvRH" datatype="double" comment="Верхняя граница диапазона"/> 
    <rt:var name="pvRL" datatype="double" comment="Нижняя граница диапазона"/> 
    <rt:var name="diap" datatype="double" comment="диапазон значениий"/> 
    <rt:var name="val_AB" datatype="double" comment="Значение аварийной уставки" value="-999"/> 
    <rt:sub>Sub ValCalc()
If pv != nothing Then
	Dim val As double
	val = pv.Value

	if val &lt;= pvRL Then
		FBar = 0
	ElseIf val&gt;= pvRH Then
		FBar = -1
	ElseIf !IsLogScale Then
		FBar = -1 * (val - pvRL) / diap
	Else
		FBar = -1 * (Log10(val) - Log10(pvRL)) / (Log10(pvRH) - Log10(pvRL) )
	End If

	If (pv.Quality == PLS_QUAL_BAD) || (pv_bin.Quality == PLS_QUAL_BAD) || (pv_ana.Quality == PLS_QUAL_BAD) Then
		FColor = Color_Inval	
	ElseIf pv_bin.Value == 0 Then
		FColor = Color_ANA_HI_P
	Else
		FColor = M_Color
	End If
Else
	FBar = -1 
	FColor = Color_ErLink
End If
End Sub</rt:sub>
    <rt:sub>Sub ShowScale()
Dim s as string
Dim Num_points as Uint
dim delta as double
dim i as ubyte
dim x as double
Dim a as double
Dim b as float
dim thh as float
s = &quot;&quot;
thh = _This.height
If thh &lt;=  40 Then 
	thh = 40
End If	
	If !IsLogScale Then
		a = pvRH / 10
		b = diap / 10
		If (a - CInt(a)) == 0 then
			Num_points = CInt(b) - 1			//количество чир (верхнюю не рисуем, если она совпадает с верхней границей диапазона)
		Else
			Num_points = CInt(b)
		End If
		delta = _This.width / diap		//расстояние между чирами
		for i = 1 to Num_points
			a = (pvRL+ 10 * i)					// что пишем до округления
			x = (CInt(a) - pvRL) * delta
			s = s + &quot; M&quot; + CStr(x) + &quot; 0 L&quot; + CStr(x) + &quot; &quot; + CStr(thh - 10)
			If (i &lt;= 30) &amp;&amp; ShowDigits Then
				Digits.Child(i - 1).text = CStr(CInt(a))
				Digits.Child(i - 1).x = x
				Digits.Child(i - 1).visibility = &quot;visible&quot;
			End If
		next i
		PvRL_Dig.text = pvRL
		PvRH_Dig.text = pvRH
	Else
		Num_points = Log10(pvRH) - Log10(pvRL) - 1
		delta = _This.width / (Num_points + 1)
		for i = 1 to Num_points
			a = pvRL * (10 ** i) 
			x = ((Log10(a)   - Log10(pvRL)) * delta)
			s = s + &quot; M&quot; + CStr(x) + &quot; 0 L&quot; + CStr(x) + &quot; &quot; + CStr(thh - 10)
			If (i &lt;= 30) &amp;&amp; ShowDigits Then
				Digits.Child(i - 1).text = Round(Log10(a),0)
				Digits.Child(i - 1).x = x + 10
				Tens.Child(i - 1).x = x
				Digits.Child(i - 1).font_size = 9
				Digits.Child(i - 1).visibility = &quot;visible&quot;
				Tens.Child(i - 1).visibility = &quot;visible&quot;
			End If
		next i
		PvRL_Dig.text = Round(Log10(pvRL),0)
		PvRH_Dig.text = Round(Log10(pvRH),0)
	End If
Shkala.d = s
End Sub</rt:sub>
    <rt:sub>Sub ShowBoard(board as double, B_Border as RtSvgObj, B_Line as RtSvgObj)
Dim x as float
Dim delta as float
If (board &gt;= pvRL) &amp;&amp; (board &lt;= pvRH) Then
	If !IsLogScale Then
		delta = _This.width / diap	
		x = (board - pvRL) * delta
	Else
		delta = _This.width / (Log10(pvRH) - Log10(pvRL) )
		x = (Log10(board) - Log10(pvRL)) * delta

	End If

	B_Border.x1 = x
	B_Border.x2 = x
	B_Line.x1 = x
	B_Line.x2 = x

End If
End Sub</rt:sub>
    <rt:event type="OnResize">Dim thh as double
Dim thw as double
Dim i as ubyte

thh = _This.height
thw = _This.width

InGr.x = -2.5
InGr.width = thw + 5
Backgr_frame.width = thw
Backgr_rect.width = thw
RightLineBorder.x1 = thw
RightLineBorder.x2 = thw
RightLine.x1 = thw
RightLine.x2 = thw
SelArea.width = thw
If !IsLogScale Then
	PvRH_Dig.x = thw

Else
	PvRH_Dig.x = thw + 10
	PvRH_Ten.x = thw
	PvRL_Dig.x = 10
End If

						// высота
If thh &lt;=  40 Then 
	thh = 40
End If	

Backgr_frame.height = thh - 35
Backgr_rect.height = thh - 35
InGr.height = thh - 30
RightLineBorder.y2 = thh - 10
LeftLineBorder.y2 = thh - 10
RightLine.y2 = thh - 10
LeftLine.y2 = thh - 10
HWB_Group_HWB_Border.y2 = thh - 25
HWB_Group_HWB_Line.y2  =  thh - 25
LWB_Group_LWB_Border.y2 = thh - 25
LWB_Group_LWB_Line.y2 = thh - 25
AB_Group_AB_Border.y2 = thh - 25
AB_Group_AB_Line.y2 = thh - 25
If !IsLogScale Then
	PvRH_Dig.y = thh
	PvRL_Dig.y = thh
Else
	PvRH_Dig.y = thh - 7.5
	PvRL_Dig.y = thh - 7.5
	PvRL_Ten.y = thh
	PvRH_Ten.y = thh
End If

For i = 0 to 30
	If !IsLogScale Then
		Digits.Child(i).y = thh
	Else
		Digits.Child(i).y = thh - 7.5
		Tens.Child(i).y = thh
	End If
Next i
body.height = thh - 35
SelArea.height = thh - 10</rt:event>
    <rt:event type="OnInitialize">Set pv = RTAPLS.AnaPV(FKKS1)
Set pv_ana = RTAPLS.AnaPV(FKKS2)
Set pv_bin = RTAPLS.BinPV(FKKS3)
body.visibility = &quot;visible&quot;
M_Color = Middle_Color_Wieghted(Color_ANA_GOOD, 0xcdcdcd, 0.5)
If (pv == Nothing) || (pv_bin == Nothing) || (pv_ana == Nothing) Then
	HasError = true
	FColor = Color_ANA_ER_LINK
	Exit Sub
End If
pvRH = pv.RangeHigh
pvRL = pv.RangeLow
If ((pvRL &lt;= 0) || (pvRH &lt;= 0)) &amp;&amp; IsLogScale Then			// не может быть логарифмический масштаб при 0 начале диапазона
	HasError = true
	FColor = Color_ANA_ER_LINK
	Exit Sub
End IF
diap = pvRH  - pvRL
If diap &lt;= 0  Then
	HasError = true
	FColor = Color_ANA_ER_LINK
	Exit Sub
End If

ShowScale()
ShowBoard(val_LWB, HWB_Group_HWB_Border, HWB_Group_HWB_Line)
ShowBoard(val_HWB, LWB_Group_LWB_Border, LWB_Group_LWB_Line)
val_AB = pv_ana.Value
ShowBoard(val_AB, AB_Group_AB_Border, AB_Group_AB_Line)</rt:event>
    <rt:changeTrigger name="GRP">
      <rt:condition>pv != Nothing</rt:condition>
      <rt:chgItem>VAR(MyTaskName + &quot;.TMP_GROUP&quot;)</rt:chgItem>
      <rt:code>In_Group = (PRJSPEC.GRP_In(pv.PVId) &gt; 0)</rt:code>
    </rt:changeTrigger>
    <rt:changeTrigger name="VCalc">
      <rt:condition>!HasError</rt:condition>
      <rt:chgItem>pv</rt:chgItem>
      <rt:chgItem>pv_ana</rt:chgItem>
      <rt:chgItem>pv_bin</rt:chgItem>
      <rt:code>ValCalc()</rt:code>
    </rt:changeTrigger>
    <rt:changeTrigger name="On_pvANA">
      <rt:condition>!HasError &amp;&amp; (pv_ana != Nothing)</rt:condition>
      <rt:chgItem>pv_ana</rt:chgItem>
      <rt:code>ShowBoard(pv_ana.Value, AB_Group_AB_Border, AB_Group_AB_Line)</rt:code>
    </rt:changeTrigger>
