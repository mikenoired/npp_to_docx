    <rt:event type="OnRightClick">If  (pv == Nothing) || (pv_bin == Nothing) || (pv_ana == Nothing) Then
	NoLink(FKKS1)
ElseIf (pvRL &lt;= 0) &amp;&amp; IsLogScale Then			// не может быть логарифмический масштаб при 0 начале диапазона
	ShowWarning(&quot;Нижняя граница диапазона = 0&quot;, 10)
ElseIf (diap &gt;= 300) &amp;&amp; !IsLogScale Then
	ShowWarning(&quot;Слишком большой диапазон для линейного масштаба&quot;, 10)
ElseIf (diap &lt;= 0 ) then
	ShowWarning(&quot;Ошибка ввода данных&quot;, 10)
ElseIf !IsLogScale Then
		LoadPopUpMenu(FKKS1 + &quot;|ANAi|ws_ANA_FN &quot; + FKKS1 + &quot;|&quot;+CStr(-1))

Else
		LoadPopUpMenu(FKKS1 + &quot;|ANAi|ws_ANA_FN &quot; + FKKS1 + &quot;|&quot;+CStr(3))

End If</rt:event>
