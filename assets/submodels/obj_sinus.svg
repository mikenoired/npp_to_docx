<?xml  version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:rt="http://www.rts.co.at/2001/XMLSchema/RtSvgPL" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://www.w3.org/2000/svg C:\RTS\RtSvg\XML\SVG.xsd" preserveAspectRatio="unknown meet" viewBox="0 0 150 50" width="150" height="50" id="obj_sinus">
  <desc>Синус здоровья передачи данных</desc>
  <rt:model comment="Служебная подмодель ПОРТАЛа" revision="4.0-6.0">
    <rt:param name="InVal" datatype="double" value="0" comment="Значение входной переменной [-1; 1]"/> 
    <rt:var name="SinColor" datatype="uint" arraysize="30" comment="цвета столбиков"/> 
    <rt:var name="SinVal" datatype="float" arraysize="30" comment="высота столбиков"/> 
    <rt:sub>Sub Calculate()
If (InVal &lt; -1.0) Then
	InVal = -1.0
ElseIf (InVal &gt; 1.0) Then
	InVal = 1.0
End If
Dim i As Integer
For i = 1 to 29
	SinVal(30 - i) = SinVal(29 - i)
	SinColor(30 - i) = SinColor(29 - i)
Next i
SinVal(0) = -0.5 - 0.45 * InVal
If (SinVal(0) == SinVal(1)) &amp;&amp; (SinVal(1) == SinVal(2)) Then
	SinColor(0) = 0xff
	SinColor(1) = 0xff
	SinColor(2) = 0xff
Else
	SinColor(0) = 0xff00
End If
Dim o As RtSvgObj
For i = 0 To 29
	o = GR_sinus.get_Child(i)
	o.fill = SinColor(i)
	o.rt_filly = SinVal(i)
Next i
End Sub</rt:sub>
    <rt:event type="OnInitialize">Dim i As Integer
Dim o As RtSvgObj
For i = 0 To 29
	o = GR_sinus.get_Child(i)
	o.fill = 0xcdcdcd
	o.rt_filly = -0.01
	SinVal(i) = -1.0
	SinColor(i) = 0xcdcdcd
Next i</rt:event>
    <rt:event type="OnResize">edge.stroke_width = 2</rt:event>
    <rt:cycleTrigger name="MoveSin" cycle="1" unit="second">
      <rt:code>Calculate()</rt:code>
    </rt:cycleTrigger>
  </rt:model>
