<?xml  version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:rt="http://www.rts.co.at/2001/XMLSchema/RtSvgPL" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://www.w3.org/2000/svg C:\RTS\RtSvg\XML\SVG.xsd" preserveAspectRatio="codedlayout meet" viewBox="0 0 100 50" width="100" height="50" id="ps_Ros3_ana_bar_DoublePower_h" stroke="black" font-size="13">
  <desc>Барограф для отображения периода удвоения мощности горизонтальный</desc>
  <rt:model comment="Пользовательская подмодель ПОРТАЛа" revision="6.0" modelversion="0.0.0.0">
    <rt:param name="FKKS1" datatype="string" comment="Идентификатор сигнала заливки"/> 
    <rt:param name="FKKS2" datatype="string" comment="Идентификатор уставки"/> 
    <rt:param name="Board_Color" datatype="string" value="blue" comment="Цвет уставки"/> 
    <rt:param name="ShowDigits" datatype="boolean" value="true" comment="Показывать значения шкалы"/> 
    <rt:var name="pv" datatype="PlsPVAna" value="" comment="DB PV"/> 
    <rt:var name="pv_ana" datatype="PlsPVAna" comment="DB PV"/> 
    <rt:var name="In_Group" datatype="boolean" value="false" comment="object in group"/> 
    <rt:var name="FBar" datatype="float" value="1" comment="fill level"/> 
    <rt:var name="FColor" datatype="uint" comment="цвет индикации"/> 
    <rt:var name="M_Color" datatype="uint" comment="Приглушенный цвет"/> 
    <rt:var name="HasError" datatype="boolean" value="false" comment="Ошибка данных"/> 
    <rt:var name="val_AB" datatype="double" comment="Значение аварийной уставки" value="-999"/> 
    <rt:sub>Sub ValCalc()
Dim thw as double
thw = _This.width
If pv == nothing Then
	body.x = 0
	body.width = thw
	FColor = Color_ErLink
	Exit Sub
End If

Dim val As double
Dim f as float
Dim delta as float
Dim start as float
Dim a as float

	val = pv.Value
	If val != 0 Then
		f = 1 / val
	End If

	If (f &lt; (-1) / 160.0) Then 
		f = -1 / 160.0
	ElseIf (f &gt; 1 / 20.0 + 1 / 160.0) Then
		f = 1 / 20.0 + 1 / 160.0
	End If
	If (pv.Quality == PLS_QUAL_BAD) || (pv_ana.Quality == PLS_QUAL_BAD) || (val == 0)Then
		FColor = Color_Inval	
	ElseIf (val &lt;= 20) &amp;&amp; (val &gt; 0) Then
		FColor = Color_ANA_HI_A
	Elseif (val &lt;= 40) &amp;&amp; (val &gt; 0) Then
		FColor = Color_ANA_HI_P
	Else
		FColor = M_Color
	End If

start = thw / 10.0
delta = thw / (1 / 20.0 + 2 / 160.0)
If val == 0 Then
	body.x = 0
	body.width = thw
ElseIf val &gt; 0 Then
	body.x = start
	body.width = f * delta
Else
	body.x = start + f * delta
	body.width = Abs(f * delta)
End If

End Sub</rt:sub>
    <rt:sub>Sub ShowBoard(board as double, B_Border as RtSvgObj, B_Line as RtSvgObj)
Dim f as float
If board != 0 Then
	f = 1 / board
	Dim x as float
	Dim delta as float
	Dim start as float
	Dim thw as float

	thw = _This.width
	start = thw / 10.0
	delta = thw / (1 / 20.0 + 2 / 160.0)
	If (f &gt; 0.05625) Then
		x = thw
	ElseIf (f &lt; (-1 / 160.0)) Then
		x = 0 
	Else
		x = start + f * delta
	End If
		B_Border.x1 = x
		B_Border.x2 = x
		B_Line.x1 = x
		B_Line.x2 = x
End If

End Sub</rt:sub>
    <rt:event type="OnResize">Dim thh as double
Dim thw as double
Dim i as ubyte

thw = _This.width		

InGr.x = -2.5
InGr.width = thw + 5
Backgr_frame.width = thw
Backgr_rect.width = thw
RightLineBorder.x1 = thw
RightLineBorder.x2 = thw
RightLine.x1 = thw
RightLine.x2 = thw
SelArea.width = thw

Digits_Dig20.x = thw / 10.0 * 9
Digits_Dig40.x = thw / 2.0 
Digits_Dig80.x = thw / 10.0 * 3
Digits_Dig160.x = thw / 10.0 * 2
Digits_DigBesk.x = thw / 10.0

HB_Group_HB_Border.x1 = thw / 10.0 * 9
HB_Group_HB_Border.x2 = thw / 10.0 * 9
HB_Group_HB_Line.x1  =  thw / 10.0 * 9
HB_Group_HB_Line.x2  =  thw / 10.0 * 9
LB_Group_LB_Border.x1 = thw / 2.0
LB_Group_LB_Border.x2 = thw / 2.0
LB_Group_LB_Line.x1 = thw / 2.0
LB_Group_LB_Line.x2 = thw / 2.0 

Lines_Line20.x1 = thw / 10.0 * 9
Lines_Line20.x2 = thw / 10.0 * 9
Lines_Line40.x1 = thw / 2.0
Lines_Line40.x2 = thw / 2.0
Lines_Line160.x1 = thw / 10.0 * 2
Lines_Line160.x2 = thw / 10.0 * 2
Lines_Line80.x1 = thw / 10.0 * 3
Lines_Line80.x2 = thw / 10.0 * 3
Lines_LineBesk.x1 = thw / 10.0 
Lines_LineBesk.x2 = thw / 10.0 

thh = _This.height	
If thh &lt;  40 Then 
	thh = 40
End If	

Backgr_frame.height = thh - 35
Backgr_rect.height = thh - 35
InGr.height = thh - 30

RightLineBorder.y2 = thh - 10
RightLine.y2 = thh - 10

LeftLine.y2 = thh - 10
LeftLineBorder.y2 = thh - 10

HB_Group_HB_Border.y2 = thh - 25
HB_Group_HB_Line.y2  =  thh - 25
LB_Group_LB_Border.y2 = thh - 25
LB_Group_LB_Line.y2 = thh - 25
AB_Group_AB_Border.y2 = thh - 25
AB_Group_AB_Line.y2 = thh - 25
Lines_Line160.y2 = thh - 10
Lines_Line80.y2 = thh - 10
Lines_Line20.y2 = thh - 10
Lines_Line40.y2 = thh - 10
Lines_LineBesk.y2 = thh - 10

body.height = thh - 35
SelArea.height = thh - 10

Digits_Dig20.y = thh
Digits_Dig40.y = thh
Digits_Dig80.y = thh
Digits_Dig160.y = thh
Digits_DigBesk.y = thh
Digits_DigMin160.y = thh</rt:event>
    <rt:event type="OnInitialize">Set pv = RTAPLS.AnaPV(FKKS1)
Set pv_ana = RTAPLS.AnaPV(FKKS2)

body.visibility = &quot;visible&quot;
M_Color = Middle_Color_Wieghted(Color_ANA_GOOD, 0xcdcdcd, 0.5)
If (pv == Nothing) || (pv_ana == Nothing) Then
	HasError = true
	FColor = Color_ANA_ER_LINK
	Exit Sub
End If

val_AB = pv_ana.Value
if val_AB != 0 Then
	ShowBoard(val_AB, AB_Group_AB_Border, AB_Group_AB_Line)
End If</rt:event>
    <rt:changeTrigger name="GRP">
      <rt:condition>pv != Nothing</rt:condition>
      <rt:chgItem>VAR(MyTaskName + &quot;.TMP_GROUP&quot;)</rt:chgItem>
      <rt:code>In_Group = (PRJSPEC.GRP_In(pv.PVId) &gt; 0)</rt:code>
    </rt:changeTrigger>
    <rt:changeTrigger name="VCalc">
      <rt:condition>!HasError</rt:condition>
      <rt:chgItem>pv</rt:chgItem>
      <rt:code>ValCalc()</rt:code>
    </rt:changeTrigger>
    <rt:changeTrigger name="On_pvANA">
      <rt:condition>!HasError &amp;&amp; (pv_ana != Nothing) &amp;&amp; (pv_ana.Value !=0)</rt:condition>
      <rt:chgItem>pv_ana</rt:chgItem>
      <rt:code>ShowBoard(pv_ana.Value, AB_Group_AB_Border, AB_Group_AB_Line)</rt:code>
      <rt:code>ValCalc()</rt:code>
    </rt:changeTrigger>
  </rt:model>
  <g id="Lines">
    <line x1="90" y1="0" x2="90" y2="40" id="Line20" stroke="black" stroke-width="2">
      <rt:dyn type="y2" mode="constant" value="_This.height - 10.0"/> 
      <rt:dyn type="x2" mode="constant" value="_This.width / 10.0 * 9"/> 
      <rt:dyn type="x1" mode="constant" value="_This.width / 10.0 * 9"/> 
    </line>
    <line x1="50" y1="0" x2="50" y2="40" id="Line40" stroke="black" stroke-width="2">
      <rt:dyn type="y2" mode="constant" value="_This.height - 10.0"/> 
      <rt:dyn type="x2" mode="constant" value="_This.width / 2.0"/> 
      <rt:dyn type="x1" mode="constant" value="_This.width / 2.0"/> 
    </line>
    <line x1="30" y1="0" x2="30" y2="40" id="Line80" stroke="black" stroke-width="2">
      <rt:dyn type="y2" mode="constant" value="_This.height - 10.0"/> 
      <rt:dyn type="x2" mode="constant" value="_This.width / 10.0 * 3"/> 
      <rt:dyn type="x1" mode="constant" value="_This.width / 10.0 * 3"/> 
    </line>
    <line x1="10" y1="0" x2="10" y2="40" id="Line160" stroke="black" stroke-width="2">
      <rt:dyn type="y2" mode="constant" value="_This.height - 10.0"/> 
      <rt:dyn type="x2" mode="constant" value="_This.width / 10.0"/> 
      <rt:dyn type="x1" mode="constant" value="_This.width / 10.0"/> 
    </line>
    <line x1="20" y1="0" x2="20" y2="40" id="LineBesk" stroke="black" stroke-width="2">
      <rt:dyn type="y2" mode="constant" value="_This.height - 10.0"/> 
      <rt:dyn type="x2" mode="constant" value="_This.width / 10.0 * 2"/> 
      <rt:dyn type="x1" mode="constant" value="_This.width / 10.0 * 2"/> 
    </line>
  </g>
  <rect x="0" y="5" width="100" height="15" rx="0" ry="0" id="Backgr_rect" fill="Col_BGmain" stroke="none">
    <rt:dyn type="height" mode="constant" value="_This.height - 35"/> 
    <rt:dyn type="width" mode="constant" value="_This.width"/> 
  </rect>
  <rect x="0" y="5" width="100" height="15" rx="0" ry="0" id="Backgr_frame" fill="none" stroke="Col_Grey5" stroke-width="1">
    <rt:dyn type="height" mode="constant" value="_This.height - 35"/> 
    <rt:dyn type="width" mode="constant" value="_This.width"/> 
  </rect>
  <rect x="-2.5" y="2.5" width="105" height="20" rx="0" ry="0" id="InGr" fill="none" stroke="Col_InGR1" stroke-width="1.5">
    <rt:dyn type="visibility" mode="onchange" value="In_Group" trans="bi">
      <rt:xy value="false" value2="1"/> 
      <rt:xy value2="0"/> 
    </rt:dyn>
  </rect>
  <rect x="0" y="5" width="100" height="15" rx="0" ry="0" id="body" visibility="hidden" rt:detect="disabled" fill="Col_Green" stroke="none">
    <rt:dyn type="fill" mode="onchange" value="FColor"/> 
    <rt:dyn type="height" mode="constant" value="_This.height - 35"/> 
  </rect>
  <g id="HB_Group">
    <line x1="90" y1="0" x2="90" y2="25" id="HB_Border" stroke="black" stroke-width="3">
      <rt:dyn type="y2" mode="constant" value="_This.height - 25.0"/> 
      <rt:dyn type="x2" mode="constant" value="_This.width / 10.0 * 9"/> 
      <rt:dyn type="x1" mode="constant" value="_This.width / 10.0 * 9"/> 
    </line>
    <line x1="90" y1="0" x2="90" y2="25" id="HB_Line" stroke="black" stroke-width="2">
      <rt:dyn type="stroke" mode="constant" value="Color_ANA_HI_A"/> 
      <rt:dyn type="y2" mode="constant" value="_This.height - 25"/> 
      <rt:dyn type="x2" mode="constant" value="_This.width / 10.0 * 9"/> 
      <rt:dyn type="x1" mode="constant" value="_This.width / 10.0 * 9"/> 
    </line>
  </g>
  <line x1="100" y1="0" x2="100" y2="40" id="RightLineBorder" stroke="black" stroke-width="3">
    <rt:dyn type="x2" mode="constant" value="_This.width"/> 
    <rt:dyn type="x1" mode="constant" value="_This.width"/> 
    <rt:dyn type="y2" mode="constant" value="_This.height - 10.0"/> 
  </line>
  <line x1="100" y1="0" x2="100" y2="40" id="RightLine" stroke="black" stroke-width="2">
    <rt:dyn type="stroke" mode="unknown" value="M_Color"/> 
    <rt:dyn type="x2" mode="constant" value="_This.width"/> 
    <rt:dyn type="x1" mode="constant" value="_This.width"/> 
    <rt:dyn type="y2" mode="constant" value="_This.height - 10.0"/> 
  </line>
  <line x1="0" y1="0" x2="0" y2="40" id="LeftLineBorder" stroke="black" stroke-width="3">
    <rt:dyn type="y2" mode="constant" value="_This.height - 10"/> 
  </line>
  <line x1="0" y1="0" x2="0" y2="40" id="LeftLine" stroke="black" stroke-width="2">
    <rt:dyn type="stroke" mode="unknown" value="M_Color"/> 
    <rt:dyn type="y2" mode="constant" value="_This.height - 10"/> 
  </line>
  <g id="LB_Group" visibility="visible" rt:detect="enabled">
    <line x1="50" y1="0" x2="50" y2="25" id="LB_Border" stroke="black" stroke-width="3">
      <rt:dyn type="y2" mode="constant" value="_This.height - 25"/> 
    </line>
    <line x1="50" y1="0" x2="50" y2="25" id="LB_Line" stroke="black" stroke-width="2">
      <rt:dyn type="stroke" mode="constant" value="Color_ANA_LO_P"/> 
      <rt:dyn type="y2" mode="constant" value="_This.height - 25"/> 
    </line>
  </g>
  <g id="AB_Group" visibility="hidden" rt:detect="disabled">
    <rt:dyn type="visibility" mode="onchange" value="HasError || (pv_ana.Value == 0)" trans="bi">
      <rt:xy value="false" value2="0"/> 
      <rt:xy value2="1"/> 
    </rt:dyn>
    <line x1="80" y1="0" x2="80" y2="25" id="AB_Border" stroke="black" stroke-width="3">
      <rt:dyn type="y2" mode="constant" value="_This.height - 25"/> 
    </line>
    <line x1="80" y1="0" x2="80" y2="25" id="AB_Line" stroke="black" stroke-width="2">
      <rt:dyn type="stroke" mode="constant" value="Board_Color"/> 
      <rt:dyn type="y2" mode="constant" value="_This.height - 25"/> 
    </line>
  </g>
  <g id="Digits" visibility="hidden" rt:detect="disabled" font-family="Verdana">
    <rt:dyn type="visibility" mode="unknown" value="ShowDigits &amp;&amp; !HasError" trans="bi">
      <rt:xy value="false" value2="1"/> 
      <rt:xy value2="0"/> 
    </rt:dyn>
    <text x="90" y="50" id="Dig20" text-anchor="middle">
      <rt:dyn type="y" mode="constant" value="_This.height"/> 
      <rt:dyn type="x" mode="constant" value="_This.width / 10.0 * 9"/> 
20</text>
    <text x="50" y="50" id="Dig40" text-anchor="middle">
      <rt:dyn type="y" mode="constant" value="_This.height"/> 
      <rt:dyn type="x" mode="constant" value="_This.width / 2.0"/> 
40</text>
    <text x="30" y="50" id="Dig80" text-anchor="middle">
      <rt:dyn type="y" mode="constant" value="_This.height"/> 
      <rt:dyn type="x" mode="constant" value="_This.width / 10.0 * 3"/> 
80</text>
    <text x="20" y="50" id="Dig160" text-anchor="middle">
      <rt:dyn type="y" mode="constant" value="_This.height"/> 
      <rt:dyn type="x" mode="constant" value="_This.width / 10.0 * 2"/> 
160</text>
    <text x="10" y="50" id="DigBesk" font-family="Verdana" font-size="20" text-anchor="middle">
      <rt:dyn type="y" mode="constant" value="_This.height"/> 
      <rt:dyn type="x" mode="constant" value="_This.width / 10.0"/> 
h</text>
    <text x="0" y="50" id="DigMin160" text-anchor="middle">
      <rt:dyn type="y" mode="constant" value="_This.height"/> 
-160</text>
  </g>
  <rect x="-2.5" y="0" width="100" height="40" rx="0" ry="0" id="SelArea" fill="silver" fill-opacity="0" stroke="none">
    <rt:event type="OnClick">If  HasError Then
	NoLink(FKKS1)
Else
	//Call_Win (&quot;ws_ANA_FN&quot;, FKKS1 + &quot;|&quot; + CStr(-1))
Open_Win_Uni(False, &quot;multyKKS&quot;, &quot;Составной объект&quot;, &quot;wi_MultyPV&quot;, FKKS1 + &quot;|&quot; + FKKS2)

End If</rt:event>
    <rt:event type="OnRightClick">If  HasError Then
	NoLink(FKKS1)
Else
	LoadPopUpMenu(FKKS1 + &quot;|ANAi|ws_ANA_FN &quot; + FKKS1 + &quot;|&quot; + CStr(-1))
End If</rt:event>
  </rect>
</svg>
