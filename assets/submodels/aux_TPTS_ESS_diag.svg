    <rt:sub>Sub F1_diag()
	HighlightMessage(F1_gr_UEBA, PRJSPEC.DetectBit(F1, 9), 0xf5)
	HighlightMessage(F1_gr_UAV, PRJSPEC.DetectBit(F1, 10), 0xf5)
	HighlightMessage(F1_gr_TE, PRJSPEC.DetectBit(F1, 11), Middle_Color_Wieghted(Color_Imitation, 0,0.75))
	HighlightMessage(F1_gr_AZS, PRJSPEC.DetectBit(F1, 12), 0xf5)
	HighlightMessage(F1_gr_EFZAV, PRJSPEC.DetectBit(F1, 13), 0xf5)
	HighlightMessage(EFAZV_EFAZM, PRJSPEC.DetectBit(VB10, 12) || PRJSPEC.DetectBit(F1, 14), 0xf5)
	HighlightMessage(F1_gr_LZAFV, PRJSPEC.DetectBit(F1, 15), 0xf5)
	HighlightMessage(F1_gr_LZZUV, PRJSPEC.DetectBit(F1, 16), 0xf5)
End Sub</rt:sub>
