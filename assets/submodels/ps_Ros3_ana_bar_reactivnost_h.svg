<?xml  version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:rt="http://www.rts.co.at/2001/XMLSchema/RtSvgPL" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://www.w3.org/2000/svg C:\RTS\RtSvg\XML\SVG.xsd" preserveAspectRatio="codedlayout meet" viewBox="0 0 100 40" width="100" height="40" id="ps_Ros3_ana_bar_reactivnost_h" stroke="black">
  <desc>Барограф для отображения реактивности</desc>
  <rt:model comment="Пользовательская подмодель ПОРТАЛа" revision="6.0" modelversion="0.0.0.0">
    <rt:param name="PointID" datatype="string" comment="Идентификатор сигнала заливки"/> 
    <rt:param name="ShowDigits" datatype="boolean" value="true" comment="Показывать значения шкалы"/> 
    <rt:var name="pv" datatype="PlsPVAna" value="" comment="DB PV"/> 
    <rt:var name="In_Group" datatype="boolean" value="false" comment="object in group"/> 
    <rt:var name="FBar" datatype="float" value="1" comment="fill level"/> 
    <rt:var name="FColor" datatype="uint" comment="цвет индикации"/> 
    <rt:var name="ht" datatype="float" comment="высота барографа"/> 
    <rt:var name="c1" datatype="double" comment="log10(25)"/> 
    <rt:var name="M_Color" datatype="uint" comment="Приглушенный цвет"/> 
    <rt:sub>Sub ValCalc()
If pv != nothing Then
	Dim val As double
	val = pv.Value
	If (val &lt;= -25) Then
		FBar = 0
	ElseIf (val &gt; -25) &amp;&amp; (val &lt; -1) Then
		FBar = -0.3 * (1 - Log10(- val) / c1)

	ElseIf (val &gt;= -1) &amp;&amp; (val &lt; 1) Then
		FBar = -0.3 - 0.35 * (1.0 + val)
	Else
		FBar = -1
	End If
	If (pv.Quality == PLS_QUAL_BAD) Then
		FColor = Color_Inval	
	Else
		FColor = M_Color
	End If
Else
	FBar = -1
	FColor = Color_ErLink
End If
End Sub</rt:sub>
    <rt:event type="OnResize">Dim thw  as double
Dim thh as double
thw = _This.width
InGr.x = -2.5
InGr.width = thw + 5
Backgr_frame.width = thw
Backgr_rect.width= thw
Lines_SVGLine0.x1 = thw * 0.3
Lines_SVGLine0.x2 = thw * 0.3
Lines_SVGLine1.x1 = thw * 0.65
Lines_SVGLine1.x2 = thw * 0.65
Lines_SVGLine3.x1 = thw
Lines_SVGLine3.x2 = thw
Lin3_Border.x1= thw
Lin3_Border.x2= thw
Digits_Dig1.x = thw - 2.5
Digits_Dig0.x = thw * 0.65 + 4.0
Digits_DigMin1.x = thw * 0.3 + 2.5
SelArea.width = thw
					// высота
thh = _This.height
If thh &lt;= 30 Then
	thh = 30
End If
InGr.height = thh - 20
Backgr_frame.height = thh - 25
Backgr_rect.height = thh - 25
Lines_SVGLine0.y2 = thh
Lines_SVGLine1.y2 = thh
Lines_SVGLine2.y2 = thh
Lines_SVGLine3.y2 = thh
Lin2_Border.y2= thh
Lin3_Border.y2= thh
Digits_Dig1.y = thh - 12.5
Digits_Dig0.y = thh - 12.5
Digits_DigMin1.y = thh - 12.5
Digits_DigMin25.y = thh - 12.5
body.height = thh - 25
SelArea.height = thh - 25</rt:event>
    <rt:event type="OnInitialize">Set pv = RTAPLS.AnaPV(PointID)
If pv == Nothing Then
	FColor = Color_ANA_ER_LINK
End If
ht = _This.height
c1 = Log10(25)
body.visibility = &quot;visible&quot;
M_Color = Middle_Color_Wieghted(Color_ANA_GOOD, 0xcdcdcd, 0.5)</rt:event>
    <rt:changeTrigger name="GRP">
      <rt:condition>pv != Nothing</rt:condition>
      <rt:chgItem>VAR(MyTaskName + &quot;.TMP_GROUP&quot;)</rt:chgItem>
      <rt:code>In_Group = (PRJSPEC.GRP_In(pv.PVId) &gt; 0)</rt:code>
    </rt:changeTrigger>
    <rt:changeTrigger name="VCalc">
      <rt:chgItem>pv</rt:chgItem>
      <rt:code>ValCalc()</rt:code>
    </rt:changeTrigger>
  </rt:model>
  <rect x="0" y="5" width="100" height="15" rx="0" ry="0" id="Backgr_rect" fill="Col_BGmain" stroke="none">
    <rt:dyn type="width" mode="constant" value="_This.width"/> 
  </rect>
  <rect x="0" y="5" width="100" height="15" rx="0" ry="0" id="Backgr_frame" fill="none" stroke="Col_Grey5" stroke-width="1">
    <rt:dyn type="width" mode="constant" value="_This.width"/> 
  </rect>
  <rect x="-2.5" y="2.5" width="105" height="20" rx="0" ry="0" id="InGr" fill="none" stroke="Col_InGR1" stroke-width="1.5">
    <rt:dyn type="visibility" mode="onchange" value="In_Group" trans="bi">
      <rt:xy value="false" value2="1"/> 
      <rt:xy value2="0"/> 
    </rt:dyn>
  </rect>
  <line x1="0" y1="0" x2="0" y2="40" id="Lin2_Border" stroke="black" stroke-width="3"/> 
  <line x1="100" y1="0" x2="100" y2="40" id="Lin3_Border" stroke="black" stroke-width="3">
    <rt:dyn type="x1" mode="constant" value="_This.width"/> 
    <rt:dyn type="x2" mode="constant" value="_This.width"/> 
  </line>
  <g id="Lines" stroke-width="2">
    <line x1="30" y1="0" x2="30" y2="40" stroke="black">
      <rt:dyn type="x1" mode="constant" value="_This.width * 0.3"/> 
      <rt:dyn type="x2" mode="constant" value="_This.width * 0.3"/> 
    </line>
    <line x1="65" y1="0" x2="65" y2="40" stroke="black">
      <rt:dyn type="x1" mode="constant" value="_This.width * 0.65"/> 
      <rt:dyn type="x2" mode="constant" value="_This.width * 0.65"/> 
    </line>
    <line x1="0" y1="0" x2="0" y2="40" stroke="black">
      <rt:dyn type="stroke" mode="unknown" value="M_Color"/> 
    </line>
    <line x1="100" y1="0" x2="100" y2="40" stroke="black">
      <rt:dyn type="stroke" mode="unknown" value="M_Color"/> 
      <rt:dyn type="x1" mode="constant" value="_This.width"/> 
      <rt:dyn type="x2" mode="constant" value="_This.width"/> 
    </line>
  </g>
  <rect x="0" y="5" width="100" height="15" rx="0" ry="0" rt:fillx="0.3" id="body" visibility="hidden" rt:detect="disabled" fill="Col_Green" stroke="none">
    <rt:dyn type="fill" mode="onchange" value="FColor"/> 
    <rt:dyn type="rt:fillx" mode="onchange" value="-FBar"/> 
    <rt:dyn type="width" mode="unknown" value="_This.width"/> 
  </rect>
  <g id="Digits" visibility="hidden" rt:detect="disabled" font-size="13" text-anchor="start">
    <rt:dyn type="visibility" mode="unknown" value="ShowDigits" trans="bi">
      <rt:xy value="false" value2="1"/> 
      <rt:xy value2="0"/> 
    </rt:dyn>
    <text x="97.5" y="27.5" id="Dig1" text-anchor="end">
      <rt:dyn type="x" mode="constant" value="_This.width - 2.5"/> 
      <rt:dyn type="y" mode="unknown" value="_This.height - 2.5"/> 
1</text>
    <text x="67.5" y="27.5" id="Dig0">
      <rt:dyn type="x" mode="constant" value="_This.width * 0.65 + 4"/> 
      <rt:dyn type="y" mode="unknown" value="_This.height - 2.5"/> 
0</text>
    <text x="32.5" y="27.5" id="DigMin1">
      <rt:dyn type="x" mode="constant" value="_This.width * 0.3 + 2.5"/> 
      <rt:dyn type="y" mode="unknown" value="_This.height - 2.5"/> 
-1</text>
    <text x="2.5" y="27.5" id="DigMin25">
      <rt:dyn type="y" mode="unknown" value="_This.height - 2.5"/> 
-25</text>
  </g>
  <rect x="-2.5" y="0" width="105" height="25" rx="0" ry="0" id="SelArea" fill="silver" fill-opacity="0" stroke="none">
    <rt:event type="OnClick">If pv == nothing Then
	NoLink(PointID)
Else
	Call_Win (&quot;ws_ANA_NB&quot;, pv.PVId + &quot;|-1&quot;)
End If</rt:event>
    <rt:event type="OnRightClick">If pv == nothing Then
	NoLink(PointID)
Else
	LoadPopUpMenu(pv.PVId + &quot;|ANAi|ws_ANA_NB &quot; + pv.PVId + &quot;|-1&quot;)
End If</rt:event>
  </rect>
</svg>
