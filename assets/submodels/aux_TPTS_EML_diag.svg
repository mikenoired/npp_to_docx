<?xml  version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:rt="http://www.rts.co.at/2001/XMLSchema/RtSvgPL" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://www.w3.org/2000/svg C:\RTS\RtSvg\XML\SVG.xsd" viewBox="0 0 495 320" width="495" height="320" id="aux_TPTS_EML_diag" font-family="AAP_Font4" font-size="13" font-weight="bold">
  <desc>подмодель диагностики для ТПТС  EML</desc>
  <rt:model comment="Служебная подмодель ПОРТАЛа" revision="6.0">
    <rt:param name="KKS" datatype="string" comment="KKS"/> 
    <rt:param name="F0" datatype="PlsPVBin" comment="указатель на BST F0"/> 
    <rt:param name="F1" datatype="PlsPVBin" comment="указатель на BST F1"/> 
    <rt:param name="F2" datatype="PlsPVBin" comment="указатель на BST F2"/> 
    <rt:param name="Z0" datatype="PlsPVBin" comment="указатель на BST Z0"/> 
    <rt:param name="B0" datatype="PlsPVBin" comment="указатель на BST B0"/> 
    <rt:param name="OU" datatype="PlsPVBin" comment="команда управления"/> 
    <rt:param name="VB6" datatype="PlsPVBin" comment="указатель на PL VB6"/> 
    <rt:param name="VB9" datatype="PlsPVBin" comment="указатель на PL VB9"/> 
    <rt:param name="VB10" datatype="PlsPVBin" comment="указатель на PL VB10"/> 
    <rt:param name="VB12" datatype="PlsPVBin" comment="указатель на PL VB12"/> 
    <rt:var name="No_OU" datatype="boolean" comment="нет переменной управления"/> 
    <rt:var name="STrig" datatype="boolean" value="false" comment="в ремонте"/> 
    <rt:var name="Is_EM" datatype="boolean" value="False" comment="А не EM ли это управляет оборудованием?"/> 
    <rt:sub>Sub F1_diag()
	HighlightMessage(F1_gr_TESTFB, PRJSPEC.DetectBit(F1, 6), 0xf5)
	HighlightMessage(F1_gr_TESTFA, PRJSPEC.DetectBit(F1, 7), 0xf5)
	HighlightMessage(F1_gr_BAAUF, PRJSPEC.DetectBit(F1, 8), 0xf5)
	HighlightMessage(F1_gr_UEBA, PRJSPEC.DetectBit(F1, 9), 0xf5)
	HighlightMessage(F1_gr_UAV, PRJSPEC.DetectBit(F1, 10), 0xf5)
	HighlightMessage(F1_gr_TE, PRJSPEC.DetectBit(F1, 11), Middle_Color_Wieghted(Color_Imitation, 0,0.75))
	HighlightMessage(F1_gr_AZS, PRJSPEC.DetectBit(F1, 12), 0xf5)
	HighlightMessage(F1_gr_EFAEV, PRJSPEC.DetectBit(F1, 13), 0xf5)
	HighlightMessage(EFEAV_EFEAM, PRJSPEC.DetectBit(VB10, 12) || PRJSPEC.DetectBit(F1, 14), 0xf5)
	HighlightMessage(F1_gr_LZEV, PRJSPEC.DetectBit(F1, 15), 0xf5)
	HighlightMessage(F1_gr_LZAV, PRJSPEC.DetectBit(F1, 16), 0xf5)
End Sub</rt:sub>
    <rt:sub>Sub F2_diag()
	HighlightMessage(F2_gr_RMF1, PRJSPEC.DetectBit(F2, 15), 0xf5)
	HighlightMessage(F2_gr_VOV, PRJSPEC.DetectBit(F2, 16), 0xf5)
End Sub</rt:sub>
    <rt:sub>Sub VB6_diag()
	HighlightMessage(VB6_gr_BAN, PRJSPEC.CheckBits(VB6, 0xe10, True), 0xf5)
	HighlightMessage(VB6_gr_BGF, PRJSPEC.DetectBit(VB6, 8), 0xf5)
	HighlightMessage(VB6_gr_M8_M6, PRJSPEC.CheckBits(VB6, 0x6, True), Middle_Color_Wieghted(Color_Imitation, 0,0.75))
	If ((VB6.Value &amp; 0x80) != 0) Then
		VB6_gr_BSM.text = &quot;ТЕХНОЛОГИЧЕСКИЙ РЕЖИМ&quot;
	Else
		VB6_gr_BSM.text = &quot;ЭКСПЛУАТАЦИОННЫЙ РЕЖИМ&quot;
	End If
End Sub</rt:sub>
    <rt:sub>Sub VB9_diag()
	HighlightMessage(VB9_gr_UEF, PRJSPEC.DetectBit(VB9, 5), 0)
	HighlightMessage(VB9_gr_UEFS, PRJSPEC.DetectBit(VB9, 6), 0)
	HighlightMessage(VB9_gr_PFE, PRJSPEC.DetectBit(VB9, 7), 0)
	HighlightMessage(VB9_gr_PFA, PRJSPEC.DetectBit(VB9, 8), 0)
	HighlightMessage(VB9_gr_BBL, PRJSPEC.DetectBit(VB9, 9), 0xf5)
	HighlightMessage(VB9_gr_ALE, PRJSPEC.DetectBit(VB9, 10), 0)
	HighlightMessage(VB9_gr_ALA, PRJSPEC.DetectBit(VB9, 11), 0)
	HighlightMessage(VB9_gr_ABE, PRJSPEC.DetectBit(VB9, 12), 0)
	HighlightMessage(VB9_gr_ABA, PRJSPEC.DetectBit(VB9, 13), 0)
	HighlightMessage(VB9_gr_S2E, PRJSPEC.DetectBit(VB9, 14), 0)
	HighlightMessage(VB9_gr_S2A, PRJSPEC.DetectBit(VB9, 15), 0)
	HighlightMessage(VB9_gr_S1A, PRJSPEC.DetectBit(VB9, 16), 0)
End Sub</rt:sub>
    <rt:sub>Sub VB10_diag()
	HighlightMessage(VB10_gr_TEST, PRJSPEC.DetectBit(VB10, 8), 0)
	HighlightMessage(VB10_gr_S1AV, PRJSPEC.DetectBit(VB10, 11), 0xf5)
	HighlightMessage(EFEAV_EFEAM, PRJSPEC.DetectBit(VB10, 12) || PRJSPEC.DetectBit(F1, 14), 0xf5)
	HighlightMessage(VB10_gr_RME, PRJSPEC.DetectBit(VB10, 15), 0)
	HighlightMessage(VB10_gr_RMA, PRJSPEC.DetectBit(VB10, 16), 0)
End Sub</rt:sub>
    <rt:sub>Sub B0_diag()
	HighlightMessage(B0_gr_HBE, PRJSPEC.DetectBit(B0, 15), 0)
	HighlightMessage(B0_gr_HBA, PRJSPEC.DetectBit(B0, 16), 0)
End Sub</rt:sub>
    <rt:sub>Sub Z0_diag()
	HighlightMessage(Z0_gr_ARE, PRJSPEC.DetectBit(Z0, 15), 0)
	HighlightMessage(Z0_gr_ARA, PRJSPEC.DetectBit(Z0, 16), 0)
End Sub</rt:sub>
    <rt:sub>Sub HighlightMessage(ByVal TxtObj As RtSvgObj, ByVal Highlight As Boolean, ByVal HighlightColor As Int)
If Highlight Then
	TxtObj.fill = HighlightColor
	TxtObj.font_size = 13
	TxtObj.font_weight = &quot;bold&quot;
Else
	TxtObj.fill = 0xa0a0a0
	TxtObj.font_size = 11
	TxtObj.font_weight = &quot;normal&quot;
End If
End Sub</rt:sub>
    <rt:sub>Sub VB12_diag()
	HighlightMessage(VB12_gr_ABESB4, PRJSPEC.DetectBit(VB12, 5), 0)
	HighlightMessage(VB12_gr_ABASB3, PRJSPEC.DetectBit(VB12, 6), 0)
	HighlightMessage(VB12_gr_ABESB2, PRJSPEC.DetectBit(VB12, 7), 0)
	HighlightMessage(VB12_gr_ABASB1, PRJSPEC.DetectBit(VB12, 8), 0)
	HighlightMessage(VB12_gr_CRCR, PRJSPEC.DetectBit(VB12, 11), 0)
//Надпись &quot;Управление БПУ&quot; просто сделана невидимой
&apos;	HighlightMessage(VB12_gr_CMCR, PRJSPEC.DetectBit(VB12, 12), 0)
	HighlightMessage(VB12_gr_INHNORC, PRJSPEC.DetectBit(VB12, 13), 0)
	HighlightMessage(VB12_gr_INHNO, PRJSPEC.DetectBit(VB12, 16), 0)
End Sub</rt:sub>
    <rt:event type="OnInitialize">//Надпись &quot;Управление БПУ&quot; просто сделана невидимой
If (OU == nothing) Then
	No_OU = True
ElseIf (OU.PVCategories != 2) Then
	No_OU = True
Else
	No_OU = False
End If
Is_EM = ((Z0.CategoryNr % 100) == 21)</rt:event>
    <rt:changeTrigger name="OnF0">
      <rt:condition>F0 != Nothing</rt:condition>
      <rt:chgItem>F0</rt:chgItem>
      <rt:code>HighlightMessage(F0_OS, PRJSPEC.DetectBit(F0, 11), 0xf5)</rt:code>
    </rt:changeTrigger>
    <rt:changeTrigger name="OnF1">
      <rt:condition>F1 != Nothing</rt:condition>
      <rt:chgItem>F1</rt:chgItem>
      <rt:code>F1_diag()</rt:code>
    </rt:changeTrigger>
    <rt:changeTrigger name="OnF2">
      <rt:condition>F2 != Nothing</rt:condition>
      <rt:chgItem>F2</rt:chgItem>
      <rt:code>F2_diag()</rt:code>
    </rt:changeTrigger>
    <rt:changeTrigger name="OnVB6">
      <rt:condition>VB6 != Nothing</rt:condition>
      <rt:chgItem>VB6</rt:chgItem>
      <rt:code>VB6_diag()</rt:code>
    </rt:changeTrigger>
    <rt:changeTrigger name="OnVB9">
      <rt:condition>VB9 != Nothing</rt:condition>
      <rt:chgItem>VB9</rt:chgItem>
      <rt:code>VB9_diag()</rt:code>
    </rt:changeTrigger>
    <rt:changeTrigger name="OnVB10">
      <rt:condition>VB10 != Nothing</rt:condition>
      <rt:chgItem>VB10</rt:chgItem>
      <rt:code>VB10_diag()</rt:code>
    </rt:changeTrigger>
    <rt:changeTrigger name="OnB0">
      <rt:condition>B0 != Nothing</rt:condition>
      <rt:chgItem>B0</rt:chgItem>
      <rt:code>B0_diag()</rt:code>
    </rt:changeTrigger>
    <rt:changeTrigger name="OnVB12">
      <rt:condition>VB12 != Nothing</rt:condition>
      <rt:chgItem>VB12</rt:chgItem>
      <rt:code>VB12_diag()</rt:code>
    </rt:changeTrigger>
    <rt:changeTrigger name="OnZ0">
      <rt:chgItem>Z0</rt:chgItem>
      <rt:code>Z0_diag()</rt:code>
    </rt:changeTrigger>
    <rt:changeTrigger name="Remont">
      <rt:chgItem>OU</rt:chgItem>
      <rt:code>STrig = PRJSPEC.GET_Susp(KKS, True)</rt:code>
      <rt:code>HighlightMessage(OU_SUSP, STrig, 0xf5)</rt:code>
    </rt:changeTrigger>
  </rt:model>
