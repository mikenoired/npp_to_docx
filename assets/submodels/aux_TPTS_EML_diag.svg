  <text x="350" y="50" id="EFEAV_EFEAM" fill="Col_Red">
    <title>VB10 - 12 (EFEAV) || F1 - 14 (EFEAM)</title>
    <rt:dyn type="visibility" mode="constant" value="(VB10 != Nothing) || (F1 !=  Nothing)" trans="bi">
      <rt:xy value="false" value2="1"/> 
      <rt:xy value2="0"/> 
    </rt:dyn>
