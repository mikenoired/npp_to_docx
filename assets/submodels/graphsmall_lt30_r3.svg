    <rt:sub>Sub graph()
	if (PointID1 &gt;= 20) &amp;&amp; (PointID1 &lt;= 168) then
		x_coordinate = 3.3*(PointID1 - 20)
		y_coordinate = 250 - (PointID2 - 50)
	elseif (PointID1 &gt; 168) then
		x_coordinate = 3.3*148
		y_coordinate = 250 - (PointID2 - 50)
	else	
		x_coordinate = -1000000
		y_coordinate = 250 - (PointID2 - 50)
	end if
	if (PointID2 &gt; 300) then	
		y_coordinate = 0
	end if	
	if (PointID2 &lt; 50) then	
		y_coordinate = 250
	end if		
	
	x_coord_T = x_coordinate + 10
	y_coord_T = y_coordinate + 25
	x_coord_P = x_coordinate + 10
	y_coord_P = y_coordinate - 15	
	if (x_coordinate&gt;410) then 
		x_coord_T = 410 
		x_coord_P = 410		
	end if
	if (y_coordinate&gt;225) then 
		y_coord_T = y_coordinate - 15 
		y_coord_P = y_coordinate - 40  		
	end if	
	
End Sub</rt:sub>
    <rt:changeTrigger name="graph">
      <rt:chgItem>PointID1</rt:chgItem>
      <rt:chgItem>PointID2</rt:chgItem>
      <rt:chgItem>PointID3</rt:chgItem>
      <rt:code>graph()</rt:code>
    </rt:changeTrigger>
  </rt:model>
