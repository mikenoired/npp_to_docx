    <polyline points="0,230 0,0 495,0" fill="none" stroke="Col_Grey5" stroke-width="2"/> 
  </g>
  <g stroke="Col_TxtStatic">
    <line x1="2.5" y1="92.5" x2="492.5" y2="92.5"/> 
    <line x1="150" y1="2.5" x2="150" y2="227.5"/> 
    <line x1="345" y1="2.5" x2="345" y2="227.5"/> 
    <line x1="2.5" y1="22.5" x2="150" y2="22.5"/> 
    <line x1="345" y1="22.5" x2="492.5" y2="22.5"/> 
    <line x1="150" y1="190.5" x2="345" y2="190"/> 
  </g>
  <text x="74.999" y="17" fill="Col_TxtStatic" font-family="AAP_Font3" font-weight="bold" text-anchor="middle">ЗАКРЫТЬ</text>
  <text x="415.006" y="17" fill="Col_TxtStatic" font-family="AAP_Font3" font-weight="bold" text-anchor="middle">ОТКРЫТЬ</text>
