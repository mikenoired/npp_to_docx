    <rt:param name="PointID2" datatype="double" comment="Давление"/> 
    <rt:param name="PointID3" datatype="string" comment="Текст - координаты"/> 
    <rt:param name="PointID4" datatype="boolean" comment="Отображать"/> 
    <rt:var name="x_coord" datatype="double" comment=""/> 
    <rt:var name="y_coord" datatype="double" comment=""/> 
    <rt:var name="x_coord_T" datatype="double" comment=""/> 
    <rt:var name="y_coord_T" datatype="double" comment=""/> 
    <rt:var name="x_coord_P" datatype="double" comment=""/> 
    <rt:var name="y_coord_P" datatype="double" comment=""/> 
    <rt:sub>Sub graph()
	if (PointID1 &gt;= 20) &amp;&amp; (PointID1 &lt;= 168) then
		x_coord = 10*(PointID1 - 20)
		y_coord = 900 - (PointID2 - 50)*3.6
	elseif (PointID1 &gt; 168) then
		x_coord = 1480
		y_coord = 900 - (PointID2 - 50)*3.6
	else	
		x_coord = -1000000
		y_coord = 900 - (PointID2 - 50)*3.6
	end if
	if (PointID2 &gt; 300) then	
		y_coord = 0
	end if	
	if (PointID2 &lt; 50) then	
		y_coord = 900
	end if	
	x_coord_T = x_coord + 15
	y_coord_T = y_coord + 55
	x_coord_P = x_coord + 15
	y_coord_P = y_coord - 20	
	if (x_coord&gt;1285) then 
		x_coord_T = 1300 
		x_coord_P = 1300		
	end if
	if (y_coord&gt;850) then 
		y_coord_T = y_coord - 20 
		y_coord_P = y_coord - 75 
	end if
	
End Sub</rt:sub>
    <rt:changeTrigger name="graph">
      <rt:chgItem>PointID1</rt:chgItem>
      <rt:chgItem>PointID2</rt:chgItem>
      <rt:code>graph()</rt:code>
    </rt:changeTrigger>
  </rt:model>
